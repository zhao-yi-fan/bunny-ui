<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dialog Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .demo { padding: 24px; min-height: 280px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <bn-button type="primary" @click="visible = true">Open dialog</bn-button>
      <bn-dialog :visible.sync="visible" title="Publish docs">
        The VitePress docs site now embeds Vue 2 demos through the built library bundle.
        <template slot="footer">
          <bn-button @click="visible = false">Cancel</bn-button>
          <bn-button type="primary" @click="visible = false">Confirm</bn-button>
        </template>
      </bn-dialog>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      Vue.use(bunnyUi.default)
      new Vue({
        el: '#app',
        data: { visible: false }
      })
    </script>
  </body>
</html>
