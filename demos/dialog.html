<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dialog Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .demo { padding: 24px; min-height: 280px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <bn-button type="primary" @click="visible = true">打开弹窗</bn-button>
      <bn-dialog :visible.sync="visible" title="发布文档">
        当前 VitePress 文档站通过组件库打包产物来嵌入真实 Vue 2 demo。
        <template slot="footer">
          <bn-button @click="visible = false">取消</bn-button>
          <bn-button type="primary" @click="visible = false">确认</bn-button>
        </template>
      </bn-dialog>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      const BunnyUI = bunnyUi.default || bunnyUi
      Vue.use(BunnyUI)
      new Vue({
        el: '#app',
        data: { visible: false }
      })
    </script>
  </body>
</html>
