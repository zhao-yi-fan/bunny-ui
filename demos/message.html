<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .demo { padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <bn-button @click="$message.info('普通提示')">信息</bn-button>
      <bn-button type="success" @click="$message.success('操作成功')">成功</bn-button>
      <bn-button type="warning" @click="$message.warn('请注意当前状态')">警告</bn-button>
      <bn-button type="danger" @click="$message.error('发生错误')">错误</bn-button>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      const BunnyUI = bunnyUi.default || bunnyUi
      Vue.use(BunnyUI)
      new Vue({ el: '#app' })
    </script>
  </body>
</html>
