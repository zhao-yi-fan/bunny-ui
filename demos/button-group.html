<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Group Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #111827; }
      .demo { padding: 24px; display: grid; gap: 18px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <div class="row">
        <bn-button-group>
          <bn-button type="primary">上一步</bn-button>
          <bn-button type="primary">当前</bn-button>
          <bn-button type="primary">下一步</bn-button>
        </bn-button-group>
      </div>
      <div class="row">
        <bn-button-group vertical size="small">
          <bn-button>顶部</bn-button>
          <bn-button>中间</bn-button>
          <bn-button>底部</bn-button>
        </bn-button-group>
      </div>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      Vue.use(bunnyUi)
      new Vue({ el: '#app' })
    </script>
  </body>
</html>
