<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watermark Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .demo { padding: 24px; }
      .card { min-height: 180px; padding: 28px; border-radius: 16px; background: linear-gradient(180deg, #ffffff, #f8fafc); box-shadow: inset 0 0 0 1px #e5e7eb; color: #1f2937; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <bn-watermark content="Bunny UI Docs">
        <div class="card">
          Internal preview content with a repeated watermark layer.
        </div>
      </bn-watermark>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      Vue.use(bunnyUi.default)
      new Vue({ el: '#app' })
    </script>
  </body>
</html>
