<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .demo { padding: 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: #0f172a; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: #f8fafc; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <span class="chip" v-for="name in names" :key="name">
        <bn-icon :name="name"></bn-icon>{{ name }}
      </span>
      <span class="chip"><bn-icon name="warning" color="#f59e0b" spin></bn-icon>旋转</span>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      const BunnyUI = bunnyUi.default || bunnyUi
      Vue.use(BunnyUI)
      new Vue({
        el: '#app',
        data: { names: ['search', 'check', 'info', 'warning', 'chevron-left', 'chevron-right'] }
      })
    </script>
  </body>
</html>
