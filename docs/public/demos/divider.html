<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divider Demo</title>
    <link rel="stylesheet" href="../dist/bunnyUi.css" />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .demo { padding: 24px; display: grid; gap: 18px; }
    </style>
  </head>
  <body>
    <div id="app" class="demo">
      <bn-divider>Center</bn-divider>
      <bn-divider content-position="left">Left</bn-divider>
      <bn-divider content-position="right">Right</bn-divider>
    </div>
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
    <script src="../dist/bunnyUi.umd.js"></script>
    <script>
      Vue.use(bunnyUi.default)
      new Vue({ el: '#app' })
    </script>
  </body>
</html>
